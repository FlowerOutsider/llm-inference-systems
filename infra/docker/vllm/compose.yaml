name: llm-inference-vllm

services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.8.5}
    gpus: all
    ipc: host
    init: true
    restart: unless-stopped
    stop_grace_period: 30s

    ports:
      - "${VLLM_HOST_PORT:-8002}:8000"

    environment:
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TOKENIZERS_PARALLELISM: "false"

    volumes:
      - type: bind
        source: ${HF_CACHE_DIR:-../../../.cache/huggingface}
        target: /root/.cache/huggingface
        read_only: false
      - type: volume
        source: vllm_compile_cache
        target: /root/.cache/vllm

    command:
      - --model
      - ${MODEL_ID:-Qwen/Qwen2.5-0.5B-Instruct}
      - --served-model-name
      - ${SERVED_MODEL_NAME:-qwen2.5-0.5b}
      - --dtype
      - ${DTYPE:-half}
      - --gpu-memory-utilization
      - ${GPU_MEMORY_UTILIZATION:-0.70}
      - --max-model-len
      - ${MAX_MODEL_LEN:-2048}
      - --max-num-seqs
      - ${MAX_NUM_SEQS:-16}
      - --max-num-batched-tokens
      - ${MAX_NUM_BATCHED_TOKENS:-2048}
      - --enable-prefix-caching
      - --prefix-caching-hash-algo
      - ${PREFIX_CACHE_HASH_ALGO:-sha256}
      - --generation-config
      - vllm
      - --disable-log-requests

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.0.1}
    restart: unless-stopped

    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle

    volumes:
      - type: bind
        source: ./prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
      - type: bind
        source: ./prometheus/rules
        target: /etc/prometheus/rules
        read_only: true
      - type: volume
        source: prometheus_data
        target: /prometheus

    depends_on:
      vllm:
        condition: service_healthy

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.4.0}
    restart: unless-stopped

    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in infra/docker/vllm/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"

    volumes:
      - type: bind
        source: ./grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
      - type: volume
        source: grafana_data
        target: /var/lib/grafana
      - type: bind
        source: ./grafana/dashboards
        target: /var/lib/grafana/dashboards
        read_only: true

    depends_on:
      prometheus:
        condition: service_started


volumes:
  vllm_compile_cache:
  prometheus_data:
  grafana_data: